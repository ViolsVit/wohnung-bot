name: Wohnung-бот (кожні 20 хв)

on:
  schedule:
    # кожні 20 хв з 06:00 до 23:40 за віденським часом (UTC+2 влітку; взимку зсунеться на годину)
    - cron: "*/20 4-21 * * *"
  workflow_dispatch: {}      # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write            # щоб зберігати state/seen.json

concurrency:
  group: wohnung-bot         # спільна черга з додатковим пошуком — щоб не конфліктували
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Пошук квартир (willhaben, ImmoScout24)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Зберегти стан
        if: always()
        run: |
          git config user.name "wohnung-bot"
          git config user.email "wohnung-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet && exit 0
          git commit -m "update seen"
          git pull --rebase -X theirs || true
          git push
